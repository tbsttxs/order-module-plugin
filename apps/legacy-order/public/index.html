<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atelier · 老品下单</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Sans+SC:wght@400;500;600;700&display=swap');:root{--ink:#202825;--muted:#77817b;--paper:#fffefa;--canvas:#f1efe8;--line:#deded5;--leaf:#2f6d52;--wash:#e6f0e9;--red:#b65047;--night:#183429;--night-muted:#b8c9bd}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 87% 6%,#dae9db 0,transparent 26%),radial-gradient(circle at 8% 100%,#eee5d5 0,transparent 24%),var(--canvas);color:var(--ink);font:14px 'Noto Sans SC',sans-serif}.app{width:min(1380px,94vw);height:100vh;margin:auto;padding:clamp(16px,2.4vh,32px) 0;display:grid;grid-template-rows:auto 1fr;gap:18px}header{display:flex;align-items:end;justify-content:space-between}.kicker{font-size:11px;letter-spacing:2px;color:var(--leaf);font-weight:700}.title{font:clamp(30px,3vw,43px) 'DM Serif Display','Noto Sans SC';letter-spacing:-1px;margin:4px 0 0}.meta{display:flex;gap:9px;align-items:center;color:var(--muted);font-size:12px}.dot{width:7px;height:7px;background:#5f9b78;border-radius:50%;box-shadow:0 0 0 4px #dceade}.board{min-height:0;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(360px,.9fr);gap:18px}.panel{background:rgba(255,254,250,.9);border:1px solid var(--line);box-shadow:0 18px 48px #243c2c0e;min-height:0;border-radius:18px}.composer{padding:clamp(21px,2.7vh,34px);display:grid;grid-template-columns:1fr 1fr;gap:18px;align-content:start}.composer .wide{grid-column:1/-1}.section-name{font:18px 'DM Serif Display','Noto Sans SC';margin:0 0 9px}.help{font-size:12px;line-height:1.55;color:var(--muted)}.drop{border:1px dashed #98ac9b;background:linear-gradient(135deg,#fbfdf9,#f0f6f0);padding:18px;min-height:104px;border-radius:12px;position:relative}.drop:after{content:'↑';position:absolute;right:16px;top:18px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--leaf);background:#dfeee1;font-size:17px}.drop input{width:100%;margin-top:10px}.field label{display:block;font-weight:700;margin:0 0 7px}.field input[type=text],.field input[type=password]{width:100%;padding:11px;border:1px solid var(--line);background:#fff;font:inherit}.modes{display:flex;gap:9px}.mode{flex:1;border:1px solid var(--line);padding:13px;cursor:pointer;border-radius:10px;transition:.2s transform,.2s border-color}.mode:hover{transform:translateY(-1px)}.mode:has(input:checked){border-color:var(--leaf);background:var(--wash)}.mode b{display:block;margin:3px 0}.warn{display:none;background:#fff2df;color:#84511e;padding:9px;font-size:12px;margin-top:9px}.actions{display:flex;gap:10px;align-items:center}.btn{border:0;padding:12px 16px;font:700 14px inherit;cursor:pointer}.primary{background:linear-gradient(100deg,#245f48,#3c8060);color:white;flex:1;border-radius:9px;box-shadow:0 8px 18px #2f6d5233}.pause{background:#f0ece4;color:#564c42;display:none;border-radius:9px}.pause:hover{background:#e5ddd0}.side{display:grid;grid-template-rows:auto 1fr;overflow:hidden;background:var(--night);border-color:#183429;color:#f6faf5}.identity{padding:clamp(18px,2.2vh,26px);background:linear-gradient(145deg,#315b48,#1b392d);border-bottom:1px solid #ffffff22}.identity-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.chip{font-size:11px;color:#d9edda;background:#ffffff18;padding:4px 8px;border-radius:99px}.credentials{display:grid;grid-template-columns:1fr 1fr;gap:10px}.credentials label{font-size:12px;font-weight:700;color:#edf5ed}.credentials input{width:100%;margin-top:5px;padding:9px;border:1px solid #ffffff25;background:#ffffff;color:var(--ink)}.password-wrap{display:flex;margin-top:5px;border:1px solid var(--line);background:#fff}.password-wrap input{border:0;margin:0}.eye{width:40px;border:0;border-left:1px solid #edf0eb;background:transparent;color:#4b5563;display:grid;place-items:center}.eye svg{width:16px;height:16px}.save{grid-column:1/-1;font-size:12px;color:#c7d9cb}.monitor{padding:clamp(18px,2.2vh,26px);display:flex;background:radial-gradient(circle at 95% 105%,#5f8c6f66,transparent 35%);;flex-direction:column;min-height:0}.monitor-top{display:flex;justify-content:space-between;align-items:center}.status-line{display:flex;align-items:center;gap:9px}.activity-ring{display:none;width:16px;height:16px;border:2px solid #ffffff3d;border-top-color:#a9dfb3;border-right-color:#e2f3d9;border-radius:50%;animation:activitySpin .8s linear infinite;flex:none;box-shadow:0 0 0 3px #94d7a814}@keyframes activitySpin{to{transform:rotate(360deg)}}.monitor.is-running .activity-ring{display:inline-block}.monitor.is-running .status{animation:statusPulse 1.6s ease-in-out infinite}@keyframes statusPulse{0%,100%{opacity:1}50%{opacity:.62}}.status{font-weight:700;font-size:15px;letter-spacing:.2px}.progress{height:8px;background:#ffffff1f;margin:17px 0 10px;overflow:hidden}.progress{position:relative;height:10px;border-radius:999px;background:#ffffff1f;margin:17px 0 10px;overflow:hidden}.progress i{display:block;width:0;height:100%;border-radius:999px;background:linear-gradient(90deg,#94d7a8,#e2f3d9);transition:width .45s;position:relative;overflow:hidden}.progress i::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 0%,#ffffffb8 45%,transparent 70%);transform:translateX(-100%);animation:progressShimmer 1.8s ease-in-out infinite}@keyframes progressShimmer{to{transform:translateX(100%)}}.step{font-size:13px;color:var(--night-muted);min-height:39px}.timeline{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:0}.timeline li{display:grid;grid-template-columns:19px 1fr;gap:10px;padding:8px 0;border-top:1px solid #ffffff18;color:var(--night-muted);font-size:12px}.timeline i{width:8px;height:8px;border:1px solid #9bb5a1;border-radius:50%;margin-top:5px}.timeline .active i{background:#a8e0b5;border-color:#a8e0b5}.timeline .active{color:#fff;font-weight:700}.result{margin-top:auto;padding-top:15px;font-size:12px;line-height:1.6}.download{color:#b8edc3;font-weight:700}@media(max-width:940px){body{overflow:auto}.app{height:auto;min-height:100vh}.board{grid-template-columns:1fr}.composer{grid-template-columns:1fr}.composer .wide{grid-column:auto}.side{min-height:500px}.credentials{grid-template-columns:1fr}}@media(max-height:720px) and (min-width:941px){.app{padding:12px 0;gap:10px}.drop{min-height:74px;padding:12px}.monitor,.identity,.composer{padding:14px}.timeline li{padding:5px 0}.progress{margin:10px 0}.help{line-height:1.35}}
</style><body><main class="app"><header><div><div class="kicker">Procurement atelier · old product order</div><div class="title">老品下单工作台</div></div><div class="meta"><span class="dot"></span>本机安全运行 · 逐行可追溯</div></header><section class="board"><form class="panel composer" id="f"><div class="wide"><h2 class="section-name">本次任务</h2><div class="drop"><b>上传采购任务表</b><div class="help">仅支持 .xlsx；只需要料号与下单数量。系统按所有有效行逐条处理。</div><input type="file" name="workbook" accept=".xlsx" required></div></div><div class="field"><label>执行方式</label><div class="modes"><label class="mode"><input type="radio" name="mode" value="dry-run" checked><b>只读验证</b><span class="help">定位需求，不创建记录</span></label><label class="mode"><input type="radio" name="mode" value="full-production"><b>正式下单</b><span class="help">分仓、计划、提交、审核</span></label></div><div class="warn" id="warn">正式模式会产生真实采购计划并审核通过。请仅上传已获授权数据。</div></div><div class="field"><label>结果保存位置</label><input type="text" name="outputDir" id="out"><div class="help">修改后将记为默认位置；目录不存在时自动新建。</div></div><label class="wide" id="approve" style="display:none;font-size:12px"><input type="checkbox" id="ok"> 我确认本批任务已获授权，可执行至审核通过</label><div class="actions wide"><button class="btn primary" id="go">开始执行</button><button type="button" class="btn pause" id="pause">暂停并导出当前结果</button></div></form><aside class="panel side"><section class="identity"><div class="identity-head"><h2 class="section-name" style="margin:0">采购账户</h2><span class="chip">Windows 加密保存</span></div><div class="credentials"><label>采购账号<input type="text" name="username" form="f" autocomplete="username"></label><label>采购密码<div class="password-wrap"><input type="password" id="password" name="password" form="f" autocomplete="current-password"><button type="button" class="eye" id="togglePwd" aria-label="显示密码"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.6-5.7 9.5-5.7 9.5 5.7 9.5 5.7-3.6 5.7-9.5 5.7S2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div></label><label class="save"><input type="checkbox" name="saveLogin" form="f"> 更新并长期保存这组登录信息</label></div></section><section class="monitor"><div class="monitor-top"><div class="status-line"><span class="activity-ring" id="activityRing" aria-hidden="true"></span><div class="status" id="state">等待上传任务</div></div><span class="chip" id="tag">待命</span></div><div class="progress"><i id="fill"></i></div><div class="step" id="detail">上传 Excel 后开始。本工作台会实时呈现当前业务步骤。</div><ol class="timeline" id="timeline"><li><i></i><span>定位未处理采购需求</span></li><li><i></i><span>分仓与数量重新分配</span></li><li><i></i><span>保存 PN、生成 PP</span></li><li><i></i><span>提交并审核</span></li></ol><div class="result" id="result"></div></section></aside></section></main><script>
const f=document.querySelector('#f'),monitor=document.querySelector('.monitor'),state=document.querySelector('#state'),detail=document.querySelector('#detail'),fill=document.querySelector('#fill'),go=document.querySelector('#go'),pause=document.querySelector('#pause'),warn=document.querySelector('#warn'),approve=document.querySelector('#approve'),out=document.querySelector('#out'),tag=document.querySelector('#tag'),result=document.querySelector('#result'),timeline=[...document.querySelectorAll('#timeline li')];let id=null;function prod(){return f.mode.value==='full-production'}function ui(){warn.style.display=prod()?'block':'none';approve.style.display=prod()?'block':'none'}f.mode.forEach(x=>x.onchange=ui);ui();fetch('/api/settings').then(r=>r.json()).then(s=>out.value=s.outputDir);document.querySelector('#togglePwd').onclick=()=>{const p=document.querySelector('#password'),b=document.querySelector('#togglePwd'),show=p.type==='password';p.type=show?'text':'password';b.innerHTML=show?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.6-5.7 9.5-5.7 9.5 5.7 9.5 5.7-3.6 5.7-9.5 5.7S2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.8 12s3.5-5.6 9.2-5.6c1.2 0 2.3.2 3.3.7"/><path d="M21.2 12s-3.5 5.6-9.2 5.6c-1.2 0-2.4-.3-3.4-.7"/><circle cx="12" cy="12" r="2.5"/><path d="M4 4l16 16"/></svg>'};async function poll(){try{let d=await fetch('/api/status',{cache:'no-store'}).then(r=>r.json()),j=d.active||d.history.find(x=>x.id===id);if(!j){detail.textContent='正在恢复任务状态…';return;}monitor.classList.toggle('is-running',j.status==='运行中'||j.status==='暂停请求已发送');let p=d.progress||{},map=[['定位',0],['分仓',1],['分配',1],['保存',2],['生成',2],['提交',3],['审核',3],['完成',3]];let n=map.find(x=>(p.step||'').includes(x[0]))?.[1]??0;timeline.forEach((x,i)=>x.classList.toggle('active',i<=n));fill.style.width=(j.status==='完成'||j.status==='已暂停'?100:(n+1)*23)+'%';state.textContent=j.status==='运行中'||j.status==='暂停请求已发送'?(p.step||j.status):j.status;tag.textContent=j.status;detail.textContent=j.status==='运行中'?`第 ${p.row||'-'} 行 · ${p.sku||''} · ${p.step||'正在准备'}`:j.status==='暂停请求已发送'?'将在当前安全节点暂停并回写结果…':(j.error||'');if(j.status==='运行中'||j.status==='暂停请求已发送')setTimeout(poll,900);else{go.disabled=false;pause.style.display='none';result.innerHTML=j.result?`结果已生成<br><a class="download" href="/api/download/${j.id}">下载回写 Excel</a>`:(j.error||'任务已结束，但未找到结果文件')}}catch(e){detail.textContent='正在连接任务状态…';setTimeout(poll,1200)}}pause.onclick=async()=>{pause.disabled=true;await fetch('/api/pause',{method:'POST'});tag.textContent='暂停请求已发送';detail.textContent='将在当前安全节点暂停，随后导出已回写部分。'};f.onsubmit=async e=>{e.preventDefault();if(prod()&&!document.querySelector('#ok').checked)return alert('请确认正式执行授权');go.disabled=true;result.textContent='';let data=new FormData(f);if(!data.get('saveLogin')){data.delete('username');data.delete('password')}data.set('confirm',prod()?'YES':'');let r=await fetch('/api/run',{method:'POST',body:data}),d=await r.json();if(!r.ok){state.textContent=d.error;tag.textContent='异常';go.disabled=false;return}id=d.id;pause.style.display='block';tag.textContent='运行中';poll()};
</script></body></html>
